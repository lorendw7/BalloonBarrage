name: Build desktop candidates

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v prefix
        required: true
        default: 0.1.0-demo.3
      publish_prerelease:
        description: Publish a GitHub prerelease only after both builds succeed
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.label }} candidate
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows
            label: Windows x64
            runner: windows-2022
            target: StandaloneWindows64
            package: BalloonBarrage-Windows-x64
          - id: macos
            label: macOS Universal
            runner: macos-15-intel
            target: StandaloneOSX
            package: BalloonBarrage-macOS-Universal
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - name: Require Unity activation secrets
        shell: bash
        env:
          UNITY_LICENSE_VALUE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL_VALUE: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD_VALUE: ${{ secrets.UNITY_PASSWORD }}
        run: |
          test -n "$UNITY_LICENSE_VALUE" || { echo "Missing UNITY_LICENSE"; exit 1; }
          test -n "$UNITY_EMAIL_VALUE" || { echo "Missing UNITY_EMAIL"; exit 1; }
          test -n "$UNITY_PASSWORD_VALUE" || { echo "Missing UNITY_PASSWORD"; exit 1; }
      - uses: actions/cache@v4
        with:
          path: Library
          key: Unity-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Unity-${{ runner.os }}-${{ matrix.target }}-
      - name: Build with Unity 6000.0.77f1
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.0.77f1
          targetPlatform: ${{ matrix.target }}
          buildMethod: BalloonBarrage.EditorTools.DesktopReleaseBuild.Build
          customParameters: >-
            -balloonTarget ${{ matrix.id }}
            -balloonVersion ${{ inputs.version }}
            -balloonOutput "DesktopBuild/${{ matrix.id }}"
          cacheUnityInstallationOnMac: true
      - name: Write release evidence
        shell: bash
        run: |
          mkdir -p .release
          printf '%s\n' '{"verification":"GitHub Actions Unity build and package structure completed. Physical input, audio, complete-song and target-hardware acceptance remain required."}' > .release/info.json
      - name: Package immutable candidate
        shell: bash
        run: >-
          python Tools/Release/package_desktop_demo.py
          --source "DesktopBuild/${{ matrix.id }}"
          --output "Artifacts/${{ matrix.package }}-v${{ inputs.version }}.zip"
          --tag "v${{ inputs.version }}"
          --platform "${{ matrix.id }}"
          --release-info .release/info.json
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}-v${{ inputs.version }}
          path: |
            Artifacts/${{ matrix.package }}-v${{ inputs.version }}.zip
            Artifacts/${{ matrix.package }}-v${{ inputs.version }}.zip.sha256
          if-no-files-found: error

  publish:
    if: ${{ inputs.publish_prerelease }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: BalloonBarrage-*-v${{ inputs.version }}
          path: release-assets
          merge-multiple: true
      - name: Create immutable prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "v${{ inputs.version }}" release-assets/* \
            --repo "$GH_REPO" --prerelease \
            --title "BalloonBarrage v${{ inputs.version }} desktop candidates" \
            --notes "Windows x64 and unsigned, unnotarized macOS Universal development candidates. Noncommercial music restrictions apply. macOS and exhibition-PC physical acceptance remain pending."

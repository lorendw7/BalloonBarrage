name: Build fallback Windows candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v prefix
        required: true
        default: 0.1.0-demo.3

permissions:
  contents: read

concurrency:
  group: fallback-windows-build-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Windows x64 fallback candidate
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - name: Verify release packager
        run: python Tools/Release/test_package_desktop_demo.py
      - name: Require Unity activation secrets
        shell: bash
        env:
          UNITY_LICENSE_VALUE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL_VALUE: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD_VALUE: ${{ secrets.UNITY_PASSWORD }}
        run: |
          test -n "$UNITY_LICENSE_VALUE" || { echo "Missing UNITY_LICENSE"; exit 1; }
          test -n "$UNITY_EMAIL_VALUE" || { echo "Missing UNITY_EMAIL"; exit 1; }
          test -n "$UNITY_PASSWORD_VALUE" || { echo "Missing UNITY_PASSWORD"; exit 1; }
      - uses: actions/cache@v4
        with:
          path: Library
          key: Unity-${{ runner.os }}-StandaloneWindows64-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Unity-${{ runner.os }}-StandaloneWindows64-
      - name: Build with Unity 6000.0.77f1
        uses: game-ci/unity-builder@v6
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.0.77f1
          targetPlatform: StandaloneWindows64
          buildMethod: BalloonBarrage.EditorTools.DesktopReleaseBuild.Build
          customParameters: >-
            -balloonTarget windows
            -balloonVersion ${{ inputs.version }}
            -balloonOutput "DesktopBuild/windows"
      - name: Write candidate evidence
        shell: bash
        run: |
          mkdir -p .release
          printf '%s\n' '{"verification":"GitHub Actions compiled and packaged this Windows fallback candidate. Physical input, audio, complete-song and target-PC acceptance remain required."}' > .release/info.json
      - name: Package immutable candidate
        shell: bash
        run: >-
          python Tools/Release/package_desktop_demo.py
          --source "DesktopBuild/windows"
          --output "Artifacts/BalloonBarrage-Windows-x64-v${{ inputs.version }}.zip"
          --tag "v${{ inputs.version }}"
          --platform windows
          --release-info .release/info.json
      - uses: actions/upload-artifact@v4
        with:
          name: BalloonBarrage-Windows-x64-v${{ inputs.version }}
          path: |
            Artifacts/BalloonBarrage-Windows-x64-v${{ inputs.version }}.zip
            Artifacts/BalloonBarrage-Windows-x64-v${{ inputs.version }}.zip.sha256
          if-no-files-found: error
      - name: Record workflow limit
        shell: bash
        run: >-
          echo "This workflow uploads a private Windows workflow artifact only.
          Local builds, Draft Releases and physical acceptance remain the primary release path."
          >> "$GITHUB_STEP_SUMMARY"

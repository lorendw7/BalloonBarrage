<!doctype html>
<html lang="{{locale}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{description}}">
  <meta name="theme-color" content="#fff4dc">
  <title>{{title}}</title>
  <link rel="canonical" href="{{canonicalUrl}}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="BalloonBarrage">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{canonicalUrl}}">
  <meta property="og:image" content="{{shareImageUrl}}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="675">
  <meta property="og:image:alt" content="{{prototypeAlt}}">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/svg+xml" href="{{base}}favicon.svg">
  <link rel="stylesheet" href="{{base}}{{styleFile}}">
  <link rel="preload" as="image" href="{{base}}assets/menu-background.webp">
  {{alternateLinks}}
  <script type="module" src="{{base}}{{scriptFile}}"></script>
</head>
<body class="{{pageClass}}">
  <a class="skip-link" href="#main">{{skip}}</a>
  <header class="site-header">
    <div class="header-inner">
    <a class="brand" href="{{home}}" aria-label="BalloonBarrage"><img src="{{base}}favicon.svg" width="32" height="32" alt=""><span>Balloon<span class="brand-color">Barrage</span></span></a>
    <nav class="main-nav" aria-label="{{navigation}}"><a href="{{home}}">{{navHome}}</a><a href="{{gameUrl}}">{{navGame}}</a><a href="{{worldUrl}}">{{worldNav}}</a><a href="{{updatesUrl}}">{{navUpdates}}</a><a href="{{artUrl}}">{{navArt}}</a><a class="nav-download" href="{{home}}#download">{{navDownload}}</a></nav>
    <nav class="language-nav" aria-label="{{language}}">{{languageLinks}}</nav>
    </div>
  </header>
  <main id="main">
{{pageContent}}
  </main>
  <footer class="section footer"><div><a class="footer-brand" href="{{home}}">{{footer}}</a><p>{{footerNote}}</p><p class="creator-credit"><span>{{creatorLabel}}</span><strong>何单东 <span lang="en">Shandong He</span></strong></p></div><details class="credits"><summary>{{credits}}</summary><p>{{creditsBody}}</p><a href="https://github.com/lorendw7/BalloonBarrage/blob/main/CREDITS.md">{{creditsLink}}</a></details><p class="privacy">{{privacy}}</p></footer>
  <dialog class="art-dialog" aria-label="{{artOpen}}"><button class="dialog-close" type="button">{{artClose}}</button><img alt=""><p></p></dialog>
  <noscript><p class="section small">{{noScript}}</p></noscript>
</body>
</html>
